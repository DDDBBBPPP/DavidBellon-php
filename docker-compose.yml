services:
  web:
    container_name: gestor_hotelero_web
    build: .
    volumes:
      - ./src:/var/www/html
      - web_vendor:/var/www/html/vendor
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    container_name: gestor_hotelero_db
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestor_hotelero
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"

  phpmyadmin:
    container_name: gestor_hotelero_phpmyadmin
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_USER: user
      PMA_PASSWORD: password
    ports:
      - "8888:80"
    depends_on:
      - db

volumes:
  db_data:
  web_vendor: